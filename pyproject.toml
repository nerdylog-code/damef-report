[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "damef-report"
version = "0.1.0"
description = "Parse synthetic DAMEF reports and build review workbooks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1,<4",
    "pdfplumber>=0.11,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
damef-report = "damef_report.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
